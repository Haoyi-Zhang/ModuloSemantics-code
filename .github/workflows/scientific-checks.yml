name: Scientific checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: python:3.12.14-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus 1 --memory 4g --memory-swap 4g
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run the complete serial finite campaign
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scientific-output
          (
            set -euo pipefail
            python -B --version
            uname -a
            cat /proc/swaps
            # /proc/swaps lists host devices even inside an isolated container.
            # Check the process cgroup instead; no host settings are changed.
            python -B - <<'PY'
          import json
          import sys
          from pathlib import Path
          assert sys.version_info[:3] == (3, 12, 14)
          group = Path('/sys/fs/cgroup')
          limits = {name: (group / name).read_text().strip()
                    for name in ('memory.max', 'memory.swap.max', 'cpu.max')}
          assert limits['memory.max'] == str(4 * 1024**3), limits
          assert limits['memory.swap.max'] == '0', limits
          quota, period = map(int, limits['cpu.max'].split())
          assert quota == period > 0, limits
          print(json.dumps({'process_cgroup_limits': limits}, sort_keys=True))
          PY
            # Parent and descendants inherit these bounds; each research child
            # additionally receives the existing 3.5 GiB / 40-44 CPU-s limits.
            ulimit -v 4194304
            ulimit -t 600
            timeout --signal=TERM --kill-after=10s 900s python -B reproduce.py
            python -B - <<'PY'
          import json
          from pathlib import Path
          from reproduce import STEPS
          r = json.loads(Path('results/reproduction.json').read_text())
          assert r['all_steps_passed']
          assert r['requested_steps'] == STEPS
          assert [row['step'] for row in r['completed_steps']] == STEPS
          assert all(row['returncode'] == 0 and not row['timed_out']
                     for row in r['completed_steps'])
          assert r['maximum_concurrent_children'] == 1
          PY
          ) > scientific-output/whole-run.log 2>&1
      - name: Upload raw execution output, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-raw-output
          if-no-files-found: error
          retention-days: 14
          path: |
            scientific-output/
            results/
            cases/
